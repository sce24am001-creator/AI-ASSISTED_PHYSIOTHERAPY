<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Hand & Wrist Physiotherapy Platform{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
        <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
        <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
        <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path>
      </svg>
      <span>HandPhysio AI</span>
      <span class="brand-badge">REHAB PLATFORM</span>
    </a>

    <div class="nav-user" id="navUserSection">
      {% if session.get('user_id') %}
        <div class="user-badge">
          <span class="user-name">{{ session.get('full_name') }}</span>
          <span class="user-role">{{ session.get('role') }}</span>
        </div>
        <button onclick="handleLogout()" class="btn btn-secondary btn-sm" id="logoutBtn">Logout</button>
      {% endif %}
    </div>
  </nav>

  <main class="main-container">
    {% block content %}{% endblock %}
  </main>

  <script>
    async function handleLogout() {
      try {
        const resp = await fetch('/api/logout', { method: 'POST' });
        if (resp.ok) {
          window.location.href = '/login';
        }
      } catch (err) {
        console.error('Logout error:', err);
      }
    }
  </script>
</body>
</html>
